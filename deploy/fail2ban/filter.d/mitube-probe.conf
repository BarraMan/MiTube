# /etc/fail2ban/filter.d/mitube-probe.conf
# Detecta escaneo/sondeo del portal: rachas de 403 (intentos de acceder al
# panel admin sin rol) y de 404 sobre la API (enumeración de rutas).
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "(GET|POST|PUT|DELETE) /api/admin[^"]*" 403\b
            ^<HOST> \S+ \S+ \[[^\]]+\] "(GET|POST|PUT|DELETE) /api/[^"]*" 404\b

ignoreregex =

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
