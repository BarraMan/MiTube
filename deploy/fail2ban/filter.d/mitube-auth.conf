# /etc/fail2ban/filter.d/mitube-auth.conf
# Detecta intentos fallidos de autenticación contra el portal MiTube
# a partir del access log de nginx (formato "combined").
#   401 = credenciales inválidas
#   423 = cuenta bloqueada (sigue intentando)
#   429 = rate limit de la app alcanzado
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "POST /api/auth/(login|register)[^"]*" (401|423|429)\b

ignoreregex =

# El log de nginx usa la hora local del servidor (formato combined por defecto)
datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
