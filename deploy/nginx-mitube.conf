# /etc/nginx/sites-available/mitube.conf
# Reverse proxy de producción para el portal MiTube (uvicorn en 127.0.0.1:8000).
# Ajusta server_name y las rutas de certificados. Activa con:
#   sudo ln -s /etc/nginx/sites-available/mitube.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Redirección HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mitube.tudominio.mx;   # <-- CAMBIA ESTO

    # Necesario para la renovación de certbot
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mitube.tudominio.mx;   # <-- CAMBIA ESTO

    # Certificados (certbot --nginx los rellena automáticamente)
    ssl_certificate     /etc/letsencrypt/live/mitube.tudominio.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mitube.tudominio.mx/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ---- Cabeceras de seguridad ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Subidas grandes del panel admin ----
    client_max_body_size 512m;

    # ---- Frontend estático servido directamente por nginx ----
    # Ajusta la ruta a donde clonaste el proyecto:
    root /opt/mitube/static;
    index index.html;

    location = / { try_files /index.html =404; }
    location /css/ { expires 7d; access_log off; }
    location /js/  { expires 7d; access_log off; }

    # ---- API y streaming hacia uvicorn ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming eficiente: sin buffering a disco, respuesta directa al cliente
        proxy_buffering off;
        proxy_request_buffering off;   # las subidas fluyen directo al backend
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
